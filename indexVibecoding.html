<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udensi O.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>
    
<!-- =========================
        NAVIGATION BAR
========================== -->

<header class="fixed top-0 left-0 w-full z-50">

    <nav
        class="mx-auto flex h-20 max-w-7xl items-center justify-between
        border-b border-white/10
        bg-slate-900/70
        backdrop-blur-xl
        px-5 md:px-8
        shadow-2xl">

        <!-- Logo -->
        <a href="#"
            class="flex items-center gap-3 group">

            <div class="relative h-12 w-12">

                <!-- Rotating Ring -->
                <div
                    class="absolute inset-0 rounded-full
                    border-[3px]
                    border-fuchsia-400
                    border-t-transparent
                    animate-spin
                    [animation-duration:3s]">
                </div>

                <!-- Letter -->
                <div
                    class="absolute left-1/2 top-1/2
                    flex h-8 w-8
                    -translate-x-1/2
                    -translate-y-1/2
                    items-center justify-center
                    rounded-lg
                    bg-gradient-to-br
                    from-purple-700
                    to-indigo-900
                    font-extrabold
                    text-white
                    shadow-lg">

                    U

                </div>

            </div>

            <span
                class="text-2xl font-extrabold
                tracking-wide
                text-white
                transition
                group-hover:text-fuchsia-400">

                Denzix

            </span>

        </a>

        <!-- Desktop Menu -->
        <ul
            class="hidden
            items-center
            gap-8
            font-medium
            text-white
            md:flex">

            <li>
                <a href="#home"
                    class="relative transition duration-300 hover:text-fuchsia-400
                    after:absolute after:left-0 after:-bottom-2
                    after:h-[2px] after:w-0
                    after:bg-fuchsia-400
                    after:transition-all
                    hover:after:w-full">

                    Home

                </a>
            </li>

            <li>
                <a href="#about"
                    class="relative transition duration-300 hover:text-fuchsia-400
                    after:absolute after:left-0 after:-bottom-2
                    after:h-[2px] after:w-0
                    after:bg-fuchsia-400
                    after:transition-all
                    hover:after:w-full">

                    About Me

                </a>
            </li>

            <li>
                <a href="#projects"
                    class="relative transition duration-300 hover:text-fuchsia-400
                    after:absolute after:left-0 after:-bottom-2
                    after:h-[2px] after:w-0
                    after:bg-fuchsia-400
                    after:transition-all
                    hover:after:w-full">

                    Projects

                </a>
            </li>

            <li>
                <a href="#contact"
                    class="relative transition duration-300 hover:text-fuchsia-400
                    after:absolute after:left-0 after:-bottom-2
                    after:h-[2px] after:w-0
                    after:bg-fuchsia-400
                    after:transition-all
                    hover:after:w-full">

                    Contact

                </a>
            </li>

        </ul>

        <!-- Hamburger -->
        <button
            class="rounded-lg
            border border-white/20
            bg-white/5
            p-3
            text-white
            transition
            hover:border-fuchsia-400
            hover:bg-fuchsia-500/20
            md:hidden">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor">

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"/>

            </svg>

        </button>

    </nav>

</header>

<!-- Mobile Dropdown (Hidden by default) -->

<div
    class="hidden
    fixed
    top-20
    left-0
    w-full
    border-b
    border-white/10
    bg-slate-900/95
    backdrop-blur-xl
    md:hidden">

    <ul class="flex flex-col">

        <li>
            <a href="#home"
                class="block border-b border-white/5 px-6 py-4 text-white hover:bg-fuchsia-500/20">

                Home

            </a>
        </li>

        <li>
            <a href="#about"
                class="block border-b border-white/5 px-6 py-4 text-white hover:bg-fuchsia-500/20">

                About Me

            </a>
        </li>

        <li>
            <a href="#projects"
                class="block border-b border-white/5 px-6 py-4 text-white hover:bg-fuchsia-500/20">

                Projects

            </a>
        </li>

        <li>
            <a href="#contact"
                class="block px-6 py-4 text-white hover:bg-fuchsia-500/20">

                Contact

            </a>
        </li>

    </ul>

</div>
</body>
</html>
